<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vault</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <header>
      <h1>VAULT</h1>
      <p>Sua biblioteca Steam</p>
    </header>

    <section id="perfil" class="perfil">

      <img id="avatar" src="" alt="Avatar">

      <div>
        <h2 id="nome">Carregando...</h2>
        <p id="status">Carregando...</p>
        <p id="totalJogos">0 jogos</p>
      </div>

    </section>

    <section>

      <h2>Biblioteca</h2>

      <input
        type="text"
        id="pesquisa"
        placeholder="Pesquisar jogo..."
      >

      <div id="games" class="grid"></div>

    </section>

  </div>

  <script src="script.js"></script>

</body>
</html>
