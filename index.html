<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vault</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <header>
      <h1>VAULT</h1>
      <p>Sua biblioteca Steam</p>
    </header>

    <section id="perfil" class="perfil">

      <img id="avatar" src="" alt="Avatar">

      <div>
        <h2 id="nome">Carregando...</h2>
        <p id="status">Carregando...</p>
        <p id="totalJogos">0 jogos</p>
      </div>

    </section>

    <section class="stats">

      <div class="stat-card">
        <h3>Jogos</h3>
        <p id="statJogos">0</p>
      </div>

      <div class="stat-card">
        <h3>Horas Totais</h3>
        <p id="statHoras">0</p>
      </div>

      <div class="stat-card">
        <h3>Mais Jogado</h3>
        <p id="statTop">-</p>
      </div>

    </section>

    <section>
<section class="achievements">
  <h2>🏆 Conquistas</h2>

  <div class="achievement-card">
    <h3>Conquistas Steam</h3>
    <div class="achievement-bar">
      <div class="achievement-fill" id="achievementFill"></div>
    </div>

    <p id="achievementText">Em breve...</p>
  </div>
</section>
      <h2>Biblioteca</h2>

      <input
        type="text"
        id="pesquisa"
        placeholder="Pesquisar jogo..."
      >

      <h2>Mais Jogados</h2>

      <div id="topGames" class="top-games"></div>

      <div id="games" class="grid"></div>

    </section>

  </div>

  <script src="script.js"></script>

</body>
</html>
