<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jogo do Amigo</title>

<link rel="stylesheet" href="amigo-jogo.css">

</head>
<body>

<div id="banner" class="banner">

  <div class="overlay">

    <a href="javascript:history.back()" class="voltar">
      ← Voltar
    </a>

    <h1 id="nomeJogo">
      Carregando...
    </h1>

    <p id="horas">
      Carregando...
    </p>

  </div>

</div>

<div class="container">

  <div class="stats">

    <div class="stat">
      <h3>Horas Jogadas</h3>
      <p id="horasTotal">0</p>
    </div>

    <div class="stat">
      <h3>App ID</h3>
      <p id="appid">0</p>
    </div>

  </div>

</div>

<script src="amigo-jogo.js"></script>

</body>
</html>
