<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vault Game</title>

<link rel="stylesheet" href="jogo.css">
</head>
<body>

<div id="banner" class="banner">

  <div class="banner-overlay">

    <a href="conquistas.html" class="voltar">
      ← Voltar para Conquistas
    </a>

    <h1 id="nomeJogo">
      Carregando...
    </h1>

    <p id="progresso">
      Carregando...
    </p>

  </div>

</div>

<div class="container">

  <section class="progresso-section">

    <h2>🏆 Progresso Geral</h2>

    <div class="barra-bg">
      <div
        id="barraProgresso"
        class="barra-fill"
      ></div>
    </div>

    <p
      id="textoProgresso"
      class="texto-progresso"
    >
      0%
    </p>

  </section>

  <div class="stats">

    <div class="stat">
      <h3>Conquistas</h3>
      <p id="desbloqueadas">0</p>
    </div>

    <div class="stat">
      <h3>Total</h3>
      <p id="total">0</p>
    </div>

    <div class="stat">
      <h3>Percentual</h3>
      <p id="percentual">0%</p>
    </div>

  </div>

  <section class="medalha-section">

    <h2>🎖 Medalha</h2>

    <div id="medalha" class="medalha">
      Sem medalha
    </div>

  </section>

</div>

<script src="jogo.js"></script>

</body>
</html>
