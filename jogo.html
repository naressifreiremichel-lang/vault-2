<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vault Game</title>

<link rel="stylesheet" href="jogo.css">
</head>
<body>

<div id="banner" class="banner">

  <div class="banner-overlay">

    <a href="conquistas.html" class="voltar">
      ← Voltar
    </a>

    <h1 id="nomeJogo">
      Carregando...
    </h1>

    <p id="progresso">
      Carregando...
    </p>

  </div>

</div>

<div class="container">

  <div class="stats">

    <div class="stat">
      <h3>Conquistas</h3>
      <p id="desbloqueadas">0</p>
    </div>

    <div class="stat">
      <h3>Total</h3>
      <p id="total">0</p>
    </div>

    <div class="stat">
      <h3>Percentual</h3>
      <p id="percentual">0%</p>
    </div>

  </div>

</div>

<script src="jogo.js"></script>

</body>
</html>
